events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream backend FastAPI chạy trong Docker network (service backend:8000)
    upstream backend_servers {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Endpoint giám sát nội bộ stub_status cho Nginx Prometheus Exporter
        location /stub_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }

        # Health check endpoint
        location /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        # Reverse proxy tới FastAPI Backend API
        location /api/ {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse proxy tới FastAPI Docs
        location /docs {
            proxy_pass http://backend_servers/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://backend_servers/openapi.json;
            proxy_set_header Host $host;
        }
    }
}
